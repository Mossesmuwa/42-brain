name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check storage.js
          node --check service-worker.js
          node --check product-enhancements.js
          node --check game.js
          node --check puzzles.js
          node --check arcade.js
          node --check js/arcade/catalog.js
          node --check js/arcade/games.js
      - name: Test local storage and backup behavior
        run: node --test tests/*.test.cjs
      - name: Verify app-shell assets are present
        run: |
          test -s index.html
          test -s style.css
          test -s premium.css
          test -s manifest.webmanifest
          test -s product-enhancements.js
